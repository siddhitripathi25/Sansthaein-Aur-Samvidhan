
[package]
name = "sansthaein-aur-samvidhan"
version = "1.0.0"
description = "A gamified desktop application that teaches citizens about the Constitution of India"
authors = ["Sansthaein Aur Samvidhan Team"]
license = "ISC"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sansthaein_aur_samvidhan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
